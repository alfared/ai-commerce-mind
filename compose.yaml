services:
  postgres:
    image: pgvector/pgvector:pg17

    container_name: ai-commerce-mind-postgres

    environment:
      POSTGRES_DB: ai_commerce_mind
      POSTGRES_USER: ai_commerce_mind
      POSTGRES_PASSWORD: ai_commerce_mind

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_commerce_mind -d ai_commerce_mind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine

    container_name: ai-commerce-mind-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
